  <!-- Center Star/Beacon Accent -->
  <circle cx="50" cy="30" r="3.5" fill="url(#goldGrad)" />
  <path d="M50 22V25M50 35V38M42 30H45M55 30H58" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
</svg>
