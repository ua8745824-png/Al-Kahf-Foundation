<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022412" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e098" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#946f1c" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Diamond Shield -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
